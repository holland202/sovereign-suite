name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install numpy
      - name: verify polytopes
        run: python3 verify_polytopes.py
      - name: verify quantum claims (Clifford closure, 576 products)
        run: python3 verify_quantum_claims.py
